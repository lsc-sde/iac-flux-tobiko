apiVersion: apps/v1
kind: Deployment
metadata:
  name: executors-hybrid-executors-run
  namespace: "default"
  labels:
    app.kubernetes.io/instance: executors
    app.kubernetes.io/name: hybrid-executors
    app.kubernetes.io/version: 1.0.0
    app.kubernetes.io/component: run-executor
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: executors
      app.kubernetes.io/name: hybrid-executors
      app.kubernetes.io/component: run-executor
  replicas: 1
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: executors
        app.kubernetes.io/name: hybrid-executors
        app.kubernetes.io/version: 1.0.0
        app.kubernetes.io/component: run-executor
    spec:
      # serviceAccountName: default
      containers:
        - name: run-executor
          image: "tobikodata/tcloud:latest"
          imagePullPolicy: "IfNotPresent"
          args:
            - "executor"
            - "run"
          env:
            - name: TCLOUD_URL
              value: "https://cloud.tobikodata.com/sqlmesh/your-organization/your-project"
            - name: TCLOUD_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: executors-hybrid-executors-secrets
                  key: TCLOUD_CLIENT_ID
            - name: TCLOUD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: executors-hybrid-executors-secrets
                  key: TCLOUD_CLIENT_SECRET
            - name: SQLMESH__DEFAULT_GATEWAY
              value: "databricks"
          readinessProbe:
            exec:
              command:
                - /app/pex
                - executor
                - run
                - --check
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          resources:
            limits:
              cpu: "2"
              ephemeral-storage: 10Gi
              memory: 4Gi
            requests:
              cpu: "0.5"
              ephemeral-storage: 10Gi
              memory: 2Gi